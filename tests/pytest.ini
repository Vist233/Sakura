[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short

# 测试标记
markers =
    api: Tests that require external API calls (deselect with '-m "not api"')
    integration: Integration tests (may be slow)
    slow: Slow tests that take more than 5 seconds

