name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests (excluding API tests)
      run: |
        pytest tests/ -v \
          --ignore=tests/test_subagent_integration.py \
          --ignore=tests/test_agent_integration.py \
          -m "not integration and not api"

    - name: Check import
      run: |
        python -c "from sakura import Agent, ClaudeCodeAgent, SmartCompressor; print('All imports OK')"
